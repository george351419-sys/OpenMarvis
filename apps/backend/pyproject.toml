[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmarvis"
version = "0.0.1"
description = "Open-source Marvis-like desktop AI agent"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenMarvis Authors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "litellm>=1.50",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "tomli-w>=1.0",
  "ulid-py>=1.1",
  "Pillow>=10.4",
  "pypdf>=4.3",
  "playwright>=1.45,<2.0",
  "pyobjc-framework-Cocoa>=10.3",
  "pyobjc-framework-Quartz>=10.3",
  "pyobjc-framework-ApplicationServices>=10.3",
  "apscheduler>=3.10,<4.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
  "anyio>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["openmarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["openmarvis"]
omit = [
  "openmarvis/skill/builtins/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# Tool.execute(args: BaseModel) 是基类签名，子类用 args_model 具体类型是文档化模式；
# 用 Generic[T] 重构成本远大于收益，关掉这条规则
disable_error_code = ["override"]
